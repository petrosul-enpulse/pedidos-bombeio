name: Deploy manual na Vercel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar produção
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Validar branch e configuração
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::O deploy de produção só pode sair da branch main."
            exit 1
          fi
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Configure o secret $name no GitHub."
              exit 1
            fi
          done

      - name: Baixar o commit selecionado
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Vercel CLI
        run: npm install --global vercel@59.23.1

      - name: Publicar na Vercel e aguardar o build
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prod --yes --logs --token "$VERCEL_TOKEN" --meta "github_sha=$GITHUB_SHA")"
          vercel inspect "$deployment_url" --wait --timeout=15m --token "$VERCEL_TOKEN"
          {
            echo "### Deploy de produção concluído"
            echo "Commit: \`$GITHUB_SHA\`"
            echo "URL: $deployment_url"
          } >> "$GITHUB_STEP_SUMMARY"
